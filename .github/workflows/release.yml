name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LAPORLH_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Secret LAPORLH_KEYSTORE_BASE64 belum diisi"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        env:
          LAPORLH_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          LAPORLH_KEYSTORE_PASSWORD: ${{ secrets.LAPORLH_KEYSTORE_PASSWORD }}
          LAPORLH_KEY_ALIAS: ${{ secrets.LAPORLH_KEY_ALIAS }}
          LAPORLH_KEY_PASSWORD: ${{ secrets.LAPORLH_KEY_PASSWORD }}
        run: ./gradlew ktlintCheck assembleRelease
      - name: Verify signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signature.txt
          ! grep -q "CN=Android Debug" signature.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="laporlh-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "LaporLH $GITHUB_REF_NAME" --generate-notes
